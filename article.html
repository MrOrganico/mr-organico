<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Mr Organico">
<meta property="og:locale" content="fa_IR">
<meta property="og:title" content="مقاله | Mr Organico">
<meta property="og:description" content="مقاله تخصصی درباره توتون ارگانیک، برگ طبیعی و پیپ دست‌ساز از مجله Mr Organico؛ راهنمای انتخاب، نگهداری و مصرف بدون مواد شیمیایی افزودنی.">
<meta property="og:url" content="https://mrorganico.github.io/mr-organico/article.html">
<meta property="og:image" content="https://mrorganico.github.io/mr-organico/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mr Organico — لوگوی رسمی برند">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="مقاله | Mr Organico">
<meta name="twitter:description" content="مقاله تخصصی درباره توتون ارگانیک، برگ طبیعی و پیپ دست‌ساز از مجله Mr Organico؛ راهنمای انتخاب، نگهداری و مصرف بدون مواد شیمیایی افزودنی.">
<meta name="twitter:image" content="https://mrorganico.github.io/mr-organico/images/og-image.jpg">
<link rel="stylesheet" href="css/fonts.css">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="siteHeader"></div>
<main id="mainContent">

<section class="section" style="padding-top:44px">
  <div class="container article-wrap">
    <div id="articleBox"></div>
  </div>
</section>

</main>
<div id="siteFooter"></div>

<script src="js/products.js"></script>
<script src="js/articles.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
<script>
  renderHeader('blog.html');
  renderFooter();
  ageGate();

  const a = ARTICLES.find(x => x.id === new URLSearchParams(location.search).get('id'));
  const box = document.getElementById('articleBox');
  if(!a){
    /* صفحه خطای بدون id یا id نامعتبر: از ایندکس‌شدن در گوگل جلوگیری کن */
    (function(){
      let m = document.head.querySelector('meta[name="robots"]');
      if(!m){ m = document.createElement('meta'); m.setAttribute('name','robots'); document.head.appendChild(m); }
      m.setAttribute('content','noindex, nofollow, noarchive');
      const c = document.head.querySelector('link[rel="canonical"]');
      if(c) c.parentNode.removeChild(c);
    })();
    box.innerHTML = '<div class="empty-cart"><div class="big">📄</div><p>مقاله یافت نشد</p><a class="btn btn-gold" href="blog.html">همه مقالات</a></div>';
  } else {
    document.title = `${a.title} | Mr Organico`;

    /* ─── سئوی داینامیک مقاله: توضیح متا + canonical + BlogPosting ─── */
    (function articleSEO(){
      const BASE = 'https://mrorganico.github.io/mr-organico/';
      const url  = `${BASE}article.html?id=${encodeURIComponent(a.id)}`;
      const j    = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
      const desc = j(`${a.excerpt} — ${a.title}. مقاله تخصصی مجله Mr Organico درباره توتون ارگانیک و پیپ طبیعی.`);

      const upsert = (selector, attr, value, create) => {
        let el = document.head.querySelector(selector);
        if(!el && create){ el = document.createElement(create.tag); create.attrs.forEach(([k,v]) => el.setAttribute(k,v)); document.head.appendChild(el); }
        if(el) el.setAttribute(attr, value);
      };
      upsert('meta[name="description"]', 'content', desc, {tag:'meta', attrs:[['name','description']]});
      upsert('link[rel="canonical"]', 'href', url, {tag:'link', attrs:[['rel','canonical']]});
      upsert('meta[property="og:type"]', 'content', 'article', {tag:'meta', attrs:[['property','og:type']]});
      upsert('meta[property="og:title"]', 'content', j(`${a.title} | Mr Organico`), {tag:'meta', attrs:[['property','og:title']]});
      upsert('meta[property="og:description"]', 'content', desc, {tag:'meta', attrs:[['property','og:description']]});
      upsert('meta[property="og:url"]', 'content', url, {tag:'meta', attrs:[['property','og:url']]});
      upsert('meta[property="og:image"]', 'content', BASE + a.img, {tag:'meta', attrs:[['property','og:image']]});
      upsert('meta[name="twitter:title"]', 'content', j(`${a.title} | Mr Organico`), {tag:'meta', attrs:[['name','twitter:title']]});
      upsert('meta[name="twitter:description"]', 'content', desc, {tag:'meta', attrs:[['name','twitter:description']]});
      upsert('meta[name="twitter:image"]', 'content', BASE + a.img, {tag:'meta', attrs:[['name','twitter:image']]});

      /* تاریخ‌های شمسی معادل میلادی برای اسکیما */
      const ISO = {
        'organic-vs-chemical':        '2025-10-01',
        'pipe-guide':                 '2025-09-18',
        'storage-tips':               '2025-08-09',
        'structuring-tobacco':        '2025-10-11',
        'additive-free-tobacco':      '2025-10-07',
        'tobacco-curing-fermentation':'2025-10-04',
        'nicotine-levels-guide':      '2025-09-30',
        'hand-rolling-guide':         '2025-09-26',
        'organic-tobacco-health':     '2025-09-22'
      };
      const published = ISO[a.id] || '2025-01-01';

      const ld = {
        '@context': 'https://schema.org',
        '@type': 'BlogPosting',
        headline: j(a.title),
        description: desc,
        image: [BASE + a.img, BASE + 'images/og-image.jpg'],
        datePublished: published,
        dateModified: published,
        inLanguage: 'fa',
        mainEntityOfPage: { '@type': 'WebPage', '@id': url },
        author: { '@type': 'Organization', name: 'تحریریه Mr Organico', url: BASE },
        publisher: {
          '@type': 'Organization',
          name: 'Mr Organico',
          logo: { '@type': 'ImageObject', url: BASE + 'images/favicon-512.png', width: 512, height: 512 }
        },
        articleSection: j(a.cat),
        keywords: [j(a.cat)].concat(a.tags || []).concat(['توتون ارگانیک', 'organic tobacco', 'بدون افزودنی', 'پیپ طبیعی', 'Mr Organico']).join(', '),
        wordCount: Number(String(a.read).replace(/\D/g, '')) * 220 || 900,
        timeRequired: `PT${Number(String(a.read).replace(/\D/g, '')) || 6}M`,
        isPartOf: { '@type': 'Blog', name: 'مجله تخصصی Mr Organico', url: BASE + 'blog.html' },
        breadcrumb: {
          '@type': 'BreadcrumbList',
          itemListElement: [
            { '@type': 'ListItem', position: 1, name: 'خانه',  item: BASE + 'index.html' },
            { '@type': 'ListItem', position: 2, name: 'مجله تخصصی', item: BASE + 'blog.html' },
            { '@type': 'ListItem', position: 3, name: a.title, item: url }
          ]
        },
        about: (a.tags || []).slice(0, 5).map(t => ({ '@type': 'Thing', name: j(t) }))
      };
      document.head.querySelectorAll('script[data-dyn-ld="1"]').forEach(s => s.remove());
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.setAttribute('data-dyn-ld', '1');
      s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);
    })();

    const rel = ARTICLES
      .filter(x => x.id !== a.id)
      .map(x => ({ x, score: (x.tags || []).filter(t => (a.tags || []).includes(t)).length + (x.cat === a.cat ? 1.5 : 0) }))
      .sort((p, q) => q.score - p.score)
      .slice(0, 3)
      .map(r => r.x);

    box.innerHTML = `
      <nav class="article-crumbs crumbs" aria-label="مسیر ناوبری">
        <a href="index.html">خانه</a><span>/</span>
        <a href="blog.html">مجله تخصصی</a><span>/</span>
        <b>${a.cat}</b>
      </nav>
      <div class="article-hero"><img src="${a.img}" alt="${a.title}" loading="eager" style="width:100%;aspect-ratio:16/7.5;object-fit:cover"></div>
      <span class="p-cat">${a.cat}</span>
      <h1>${a.title}</h1>
      ${a.enTitle ? `<p class="article-en" lang="en" dir="ltr">${a.enTitle}</p>` : ''}
      <div class="article-meta">
        <span>🗓️ ${a.date}</span>
        <span>⏱️ ${a.read} مطالعه</span>
        <span>✍️ تحریریه Mr Organico</span>
        <span>🌐 فارسی + English</span>
      </div>
      <div class="article-body">${a.body}</div>
      <div style="margin-top:40px;padding:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <b>تجربه خلوص واقعی را شروع کنید 🌿</b>
        <a class="btn btn-gold" href="products.html">مشاهده محصولات</a>
      </div>
      ${rel.length ? `
      <section class="related-posts" aria-label="مقاله‌های مرتبط">
        <h2 class="related-h">مقاله‌های مرتبط</h2>
        <div class="related-grid">
          ${rel.map(r => `
            <a class="related-card" href="article.html?id=${r.id}" rel="noopener">
              <span class="related-thumb"><img src="${r.img}" alt="${r.title}" loading="lazy"></span>
              <span class="related-body">
                <b>${r.title}</b>
                <em>${r.date} · ${r.read}</em>
              </span>
            </a>`).join('')}
        </div>
        <div class="related-tags">${(a.tags || []).map(t => `<a href="blog.html?tag=${encodeURIComponent(t)}">#${t}</a>`).join('')}</div>
        <a class="btn btn-ghost" href="blog.html" style="margin-top:18px">همه مقالات مجله</a>
      </section>` : ''}`;
  }
</script>
</body>
</html>
