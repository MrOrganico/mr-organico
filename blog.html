<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجله تخصصی | Mr Organico</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="css/fonts.css">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="siteHeader"></div>

<section class="section" style="padding-top:44px">
  <div class="container">
    <div class="section-head">
      <span class="kicker">مجله Mr Organico</span>
      <h2>دانش، همراه لذت</h2>
      <p>مقالات تخصصی درباره توتون ارگانیک، پیپ و هنر نگهداری — نوشته‌شده برای علاقه‌مندان واقعی.</p>
    </div>
    <div class="blog-grid" id="blogGrid"></div>
  </div>
</section>

<div id="siteFooter"></div>

<script src="js/products.js"></script>
<script src="js/articles.js"></script>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
<script>
  renderHeader('blog.html');
  renderFooter();
  ageGate();
  document.getElementById('blogGrid').innerHTML = ARTICLES.map((a, i) => `
    <article class="post-card reveal" style="transition-delay:${i * 80}ms">
      <div class="post-thumb"><img src="${a.img}" alt="${a.title}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="post-body">
        <div class="post-meta"><span class="cat">${a.cat}</span><span>${a.date}</span><span>${a.read} مطالعه</span></div>
        <h3><a href="article.html?id=${a.id}">${a.title}</a></h3>
        <p>${a.excerpt}</p>
        <span class="more">ادامه مطلب ←</span>
      </div>
    </article>`).join('');
  initReveal();
</script>
</body>
</html>
