<script>
  renderHeader('faq.html');
  renderFooter();
  ageGate();

  const FAQS = [
    ['سفارش من چطور ارسال می‌شود و چقدر طول می‌کشد؟',
     'سفارش‌ها <b>همه‌روزه</b> با پست پیشتاز، تیپاکس یا پیک درون‌شهری ارسال می‌شوند. تحویل در تهران ۱ تا ۲ روز کاری و در سایر شهرها معمولاً ۲ تا ۴ روز کاری است. بسته‌بندی همه محصولات با فویل زیپ‌دار و کارتن محافظ انجام می‌شود.'],
    ['هزینه ارسال چقدر است؟',
     'هزینه ارسال بر اساس شهر و وزن بسته محاسبه می‌شود. برای سفارش‌های بالای <b>۵ میلیون تومان، ارسال کاملاً رایگان</b> است.'],
    ['پرداخت چطور انجام می‌شود؟',
     'پس از ثبت سفارش در سایت یا واتساپ، کارشناس ما برای تأیید تماس می‌گیرد و پرداخت از طریق <b>کارت‌به‌کارت یا درگاه امن بانکی</b> انجام می‌شود. رسید رسمی برای همه سفارش‌ها صادر می‌گردد.'],
    ['از کجا مطمئن باشم محصولات اصل و ارگانیک هستند؟',
     'تمام برگ‌های توتون Mr Organico <b>بدون هیچ افزودنی و ماده شیمیایی</b>، با خشک‌سازی سنتی و تخمیر طبیعی فرآوری می‌شوند. خاستگاه هر محصول مشخص است و در صورت تمایل می‌توانید قبل از خرید با کارشناسان ما درباره منشأ محصول گفتگو کنید.'],
    ['اگر از خرید راضی نبودم چه کنم؟',
     'طبق <a href="returns.html" style="color:var(--gold-2)">رویه بازگشت کالا</a>، لوازم جانبی تا <b>۷ روز</b> (با بسته‌بندی سالم) و توتون‌ها در صورت عدم تطابق با توضیحات، در همان روز اول قابل بازگشت هستند.'],
    ['توتون را چطور نگه دارم تا خراب نشود؟',
     'مقاله کامل <a href="article.html?id=storage-tips" style="color:var(--gold-2)">نگهداری توتون</a> را بخوانید؛ خلاصه‌اش: رطوبت متعادل، ظرف درب‌دار یا همان بسته زیپ‌دار، دمای خنک و دور از نور مستقیم.'],
    ['امکان سفارش عمده یا همکاری در فروش وجود دارد؟',
     'بله! برای فروشگاه‌ها و توزیع‌کنندگان، شرایط ویژه عمده و همچنین <b>همکاری صادراتی B2B</b> داریم. از بخش <a href="contact.html" style="color:var(--gold-2)">تماس با ما</a> درخواست بدهید.'],
    ['خرید برای افراد زیر ۱۸ سال مجاز است؟',
     'خیر. طبق قوانین، فروش محصولات دخانی به افراد زیر ۱۸ سال ممنوع است و ورود به سایت مشروط به تأیید سن است. <a href="terms.html" style="color:var(--gold-2)">قوانین کامل</a> را بخوانید.'],
    ['می‌توانم تلفنی سفارش بدهم؟',
     'حتماً. کافیست با شماره <b>09109204131</b> تماس بگیرید؛ سفارش‌گیری تلفنی، مشاوره انتخاب محصول و پیگیری مرسوله همه یک‌جا انجام می‌شود.'],
    ['کد تخفیف دارید؟',
     'باشگاه مشتریان ما به‌صورت دوره‌ای کدهای تخفیف و پک تست هدیه ارائه می‌دهد. برای باخبر شدن، در واتساپ به ما پیام بدهید.'],
  ];

  document.getElementById('faqList').innerHTML = FAQS.map(([q, a], i) => `
    <div class="faq-item reveal" style="transition-delay:${Math.min(i, 5) * 60}ms">
      <button class="faq-q">${q}<span class="fi">+</span></button>
      <div class="faq-a"><div class="faq-a-inner">${a}</div></div>
    </div>`).join('');

  /* ═══ داده ساخت‌یافته FAQPage برای نمایش غنی در نتایج گوگل ═══ */
  (function injectFAQSchema(){
    const clean = s => s.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    const ld = {
      '@context': 'https://schema.org',
      '@type': 'FAQPage',
      mainEntity: FAQS.map(([q, a]) => ({
        '@type': 'Question',
        name: clean(q),
        acceptedAnswer: { '@type': 'Answer', text: clean(a) }
      }))
    };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  })();

  document.querySelectorAll('.faq-item').forEach(item => {
    item.querySelector('.faq-q').onclick = () => {
      const open = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(x => {
        x.classList.remove('open');
        x.querySelector('.faq-a').style.maxHeight = '0px';
      });
      if(!open){
        item.classList.add('open');
        const a = item.querySelector('.faq-a');
        a.style.maxHeight = a.scrollHeight + 'px';
      }
    };
  });

  initReveal();
</script>
